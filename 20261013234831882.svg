<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans CJK JP','Yu Gothic','Microsoft YaHei',sans-serif">
  <rect width="1000" height="520" fill="#faf7f2"/>
